name: vigia
# GitHub runs "schedule" with delays of hours on a low-activity repo (seen 18/10: runs 2-5h apart).
# So each run is a LOOP of ~5h50 that checks every 2 min; the hourly schedule only
# guarantees there is always one running (concurrency keeps one, the next waits).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: Only send a test message to Telegram
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Check the VPS from outside and alert on state change
        env:
          ALVO: ${{ secrets.VPS_ALVO }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TESTE: ${{ inputs.teste }}
        run: |
          avisa() { curl -sf -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                      --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$1" > /dev/null; }
          responde() {   # SSH OR panel (nginx): only "down" if NOTHING answers
            timeout 8 bash -c "</dev/tcp/${ALVO}/22" 2>/dev/null && return 0
            timeout 8 bash -c "</dev/tcp/${ALVO}/8445" 2>/dev/null && return 0
            return 1
          }
          checa() {      # 4 tries over ~1.5 min: a glitch on the GitHub side does not raise an alarm
            for i in 1 2 3 4; do responde && { echo no_ar; return; }; sleep 25; done
            echo fora
          }
          if [ "$TESTE" = "true" ]; then
            avisa "✅ Teste do vigia da VPS (GitHub). VPS agora: $(checa)."
            exit 0
          fi
          git config user.name vigia; git config user.email vigia@users.noreply.github.com
          fim=$(( $(date +%s) + 5*3600 + 50*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            estado=$(checa)
            antes=$(cat estado.txt 2>/dev/null || echo no_ar)
            if [ "$estado" != "$antes" ]; then
              if [ "$estado" = fora ]; then
                avisa "🔴 VPS FORA DO AR (nem SSH nem painel respondem há ~2 min, checado pelo GitHub). Veja o painel da Hostinger; se estiver parada, ligue."
              else
                avisa "🟢 VPS voltou. Confira se os bots subiram (mensagens de 'no ar')."
              fi
              echo "$estado" > estado.txt
            fi
            # GitHub disables scheduled workflows after 60 days without commits: one commit per month
            mes=$(date -u +%Y-%m); [ "$(cat ultimo_mes.txt 2>/dev/null)" = "$mes" ] || echo "$mes" > ultimo_mes.txt
            git add -A
            if ! git diff --cached --quiet; then git commit -qm "estado: $estado"; git pull -q --rebase && git push -q; fi
            sleep 120
          done
